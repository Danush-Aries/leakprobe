[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "leakprobe"
version = "0.1.0"
description = "Offline system-prompt-extraction robustness tester for LLM products."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Dhanush Shankar", email = "danushankar3@gmail.com" }]
keywords = ["ai-security", "prompt-injection", "red-team", "system-prompt", "llm-security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "rapidfuzz>=3.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/Danush-Aries/leakprobe"
Repository = "https://github.com/Danush-Aries/leakprobe"

[project.scripts]
leakprobe = "leakprobe.cli:main"

[tool.setuptools]
packages = ["leakprobe"]

[tool.setuptools.package-data]
leakprobe = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
